[project]
name = "pipeline"
version = "0.1.0"
description = "HADR pipeline — USGS ingest to contract v1"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.21"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
